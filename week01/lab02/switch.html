<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <title>Lab Two Exercise One</title>
    </head>

    <body>
        <h1>Switch Statement</h2>
            <p>Look in the console for output</p>
            <script>
                let ans=prompt("What does each colour on a traffic light do?", "red");
                switch (ans)
                {
                    case "red":
                        console.log(`Stop`);
                        break;
                    case "orange":
                        console.log(`Slow down`);
                        break;
                    case "yellow":
                        console.log(`Slow down`);
                        break;
                    case "green":
                        console.log(`Go`);
                        break;
                    default:
                        console.log(`There isn't ${ans} on a traffic light`);
                }
            </script>
    </body>

</html>
