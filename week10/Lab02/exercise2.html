<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Helpers Exercise 2</title>
</head>

<body>
  <p id="content"></p>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>
  <script id="socialList" type="text/x-handlebars-template">
    <p>{{name}} on {{date}}</p>
    <p>{{comment}}</p>
    {{#if social}}
    <h1>Social Media</h1>
    <ul>
      {{#each social}}
      <li>
        {{site}} - username: {{name}}
      </li>
      {{/each}}
    </ul>
    {{else}}
    <h1>No Social Media</h1>
    {{/if}}
  </script>
  <script>
    const data = {
      name: "Jack",
      date: "12/03/25",
      comment: "This is a really <strong>awesome</strong> tutorial. Thanks.",
      social: [
        {
          site: "Twitter",
          name: "Jack_Franklin"
        },
        {
          site: "Github",
          name: "jackfranklin"
        }
      ]
    };

    let template = Handlebars.compile(document.querySelector('#socialList').innerHTML);
    let output = template(data);
    document.querySelector('#content').innerHTML = output;
  </script>
</body>

</html>
