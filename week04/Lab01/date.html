<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Date()</title>
</head>

<body>
    <p id="copyright"></p>
        
    <script>
        const today = new Date();
        const copy = '\u00A9';
        document.querySelector("#copyright").textContent = `${copy} ${today.getFullYear()} Javascript`
    </script>
</body>

</html>
