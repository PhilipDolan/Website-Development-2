<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Math Library</title>
	<style>
		body {
			width: 400px;
			margin: 0 auto;
		}

		p {
			border: solid black 1px;
			height: 20px;
		}
	</style>
</head>

<body>
	<h1>The Math Library</h1>
	<p id="num"></p>
	<p id="area"></p>
	<p id="circumference"></p>
	<button>Circle Calculations</button>
	<script>
		const btn = document.querySelector('button');

		btn.addEventListener('click', (evt) => {
			radius = parseFloat(prompt("Enter the radius"));

			document.querySelector('#num').textContent = `The number you have entered is ${radius}`
			document.querySelector('#area').textContent = `The area of the circle is ${Math.PI*(radius**2)}`
			document.querySelector('#circumference').textContent = `The circumference of the circle is ${2*Math.PI*radius}`
		})
	</script>
</body>

</html>
