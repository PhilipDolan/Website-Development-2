<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Template Exercise 1</title>
</head>

<body>
  <p></p>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>
  <script id="address" type="text/x-handlebars-template">
    <div>
      You can find me in <b>{{city}}</b>. My address is <b>${{number}} {{street}}</b>.
    </div>
  </script>
  <script>
    const context = {
      "city": "London",
      "street": "Baker Street",
      "number": "221B"
    }

    let template = Handlebars.compile(document.querySelector('#address').innerHTML);

    let output = template(context);

    document.querySelector('p').innerHTML = output;
  </script>

</body>

</html>
