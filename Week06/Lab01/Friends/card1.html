<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Array of Objects</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <h1>My Friend</h1>
  <div class="cards"></div>

  <script>

    const friend =
    {
      "name": "Stevie",
      "fullname": "Stevie Feliciano",
      "image": "images/stevie.jpg",
      "joined": 2016,
      "job": "Web Developer",
      "city": "Boston",
      "mates": 35
    }


    document.querySelector('.cards').insertAdjacentHTML('beforeend',
      `<div class="card">
    <img src="${friend.image}" alt="${friend.name}" >
    <div class="text">
      <h3>${friend.fullname}</h3>
      <p>
       <i>${friend.name}</i> is a <b>${friend.job}</b> in ${friend.city} and joined in ${friend.joined}
      </p>
	  <p><i class="fa fa-user"></i> ${friend.mates} Friends</p>
    </div>
   </div>`)
  </script>
</body>

</html>
