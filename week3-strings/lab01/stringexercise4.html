<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>String Exercise 4</title>
    <style>
        body {
            width: 400px;
            margin: 0 auto;
        }
        
        p {
            border: solid black 1px;
            height: 20px;
        }
    </style>
</head>

<body>
    <h1>String Exercise Four</h1>
    <p id="input"></p>
    <p id="letters"></p>
    <p id="numbers"></p>
    <button>String Exercise 4</button>

    <script>
        const btn = document.querySelector('button');

        const inputC = document.querySelector('#input')
        const lettersC = document.querySelector('#letters')
        const numbersC = document.querySelector('#numbers')


        btn.addEventListener('click', (evt) => {


            let coursecode = prompt("enter a 5 code ")
            let letters = coursecode.substring(0, 2)
            let numbers = parseInt(coursecode.substring(2))

            inputC.innerHTML = `The coursecode entered is  
						${coursecode}`
            lettersC.innerHTML = ` ${letters}`
            numbersC.innerHTML = ` ${numbers}`

        });
    </script>

</body>

</html>
