<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Array of Objects</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <h1>My Friends</h1>
  <div class="cards"></div>

  <script>

    const friends = [
      {
        "name": "Stevie",
        "fullname": "Stevie Feliciano",
        "image": "images/stevie.jpg",
        "joined": 2016,
        "job": "Web Developer",
        "city": "Boston",
        "mates": 35
      },
      {
        "name": "Helen",
        "fullname": "Helen Hess",
        "image": "images/helen.jpg",
        "joined": 2013,
        "job": "Art Director",
        "city": "New York",
        "mates": 22
      },
      {
        "name": "Elliot",
        "fullname": "Elliot Fu",
        "image": "images/elliot.jpg",
        "joined": 2015,
        "job": "Research Assistant",
        "city": "New York",
        "mates": 26
      },
      {
        "name": "Christian",
        "fullname": "Christian Monroe",
        "image": "images/christian.jpg",
        "joined": 2016,
        "job": "Musician",
        "city": "Boston",
        "mates": 23
      },
      {
        "name": "Matt",
        "fullname": "Matt Smith",
        "image": "images/matt.jpg",
        "joined": 2015,
        "job": "Teacher",
        "city": "New York",
        "mates": 28
      },
      {
        "name": "Jenny",
        "fullname": "Jenny Howe",
        "image": "images/jenny.jpg",
        "joined": 2014,
        "job": "UX Designer",
        "city": "Manhatten",
        "mates": 30
      }
    ]


    friends.forEach(friend => document.querySelector('.cards').insertAdjacentHTML('beforeend',
      `<div class="card">
    <img src="${friend.image}" alt="${friend.name}" >
    <div class="text">
      <h3>${friend.fullname}</h3>
      <p>
       <i>${friend.name}</i> is a <b>${friend.job}</b> in ${friend.city} and joined in ${friend.joined}
      </p>
	  <p><i class="fa fa-user"></i> ${friend.mates} Friends</p>
    </div>
   </div>`))
  </script>
</body>

</html>
